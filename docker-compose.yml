# The worker is the service you leave running; the CLI services are one-shot
# tools kept behind a profile so `docker compose up -d` starts only the worker.

x-image: &image
  build: .
  image: arxiv2epub:latest
  volumes:
    - ./out:/out
    - ./cache:/cache
  environment:
    TZ: ${TZ:-UTC}

services:
  # Watches the inbox for arXiv links and mails the EPUB to your Kindle.
  #   docker compose up -d worker
  worker:
    <<: *image
    env_file: .env
    entrypoint: ["arxiv2epub-worker"]
    restart: unless-stopped
    # The poll loop wakes every second to check for a stop signal, so it exits
    # well inside this; the allowance is for a conversion already in flight.
    stop_grace_period: 60s
    # Left unbounded, a service that runs for months fills the disk with logs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off conversion:
  #   docker compose run --rm cli 1706.03762
  cli:
    <<: *image
    profiles: ["tools"]
    entrypoint: ["arxiv2epub"]
    command: ["--cache", "/cache", "-o", "/out", "--help"]

  # Rebuild the papers used to develop this:
  #   docker compose run --rm samples
  samples:
    <<: *image
    profiles: ["tools"]
    entrypoint: ["arxiv2epub"]
    command:
      - "--cache"
      - "/cache"
      - "-o"
      - "/out"
      - "1706.03762"   # Attention Is All You Need
      - "2301.08243"   # I-JEPA
      - "2501.12948"   # DeepSeek-R1
