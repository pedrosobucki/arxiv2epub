[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv2epub"
version = "0.1.0"
description = "Turn an arXiv link into a well-formatted, Kindle-ready EPUB."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "Pillow>=10.0",
    "ziamath>=0.13",
    "cairosvg>=2.7",
    "imapclient>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arxiv2epub = "arxiv2epub.cli:main"
arxiv2epub-worker = "arxiv2epub.service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv2epub = ["resources/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
